[project]
name = "etl"
version = "0.1.0"
description = "ETL for private-fund-mcp: SEC Form D + Form ADV Schedule D 7.B.(1) to SQLite"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
